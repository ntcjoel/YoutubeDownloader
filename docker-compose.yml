services:
  ytbdl:
    build: .
    container_name: ytbdl
    network_mode: host
    user: "1000:1000"
    restart: unless-stopped
    volumes:
      - ./data/tasks_state.json:/app/tasks_state.json
      - /mnt/nfs/pt/:/app/
      - ./logs:/app/logs
      - ./cookies:/app/cookies
      - ./config.yaml:/app/config.yaml
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1917/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
