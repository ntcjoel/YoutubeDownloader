services:
  ytbdl:
    build: .
    container_name: ytbdl
    restart: unless-stopped
    ports:
      - "1917:1917"
    volumes:
      - /mnt/nfs/pt/ytb_video:/app/video
      - /mnt/nfs/pt/ytb_music:/app/music
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - TZ=Asia/Shanghai
