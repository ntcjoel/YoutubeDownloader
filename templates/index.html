<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Downloader</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #252525;
      --border: #333;
      --accent: #ff4444;
      --accent2: #ff7733;
      --text: #e0e0e0;
      --text2: #888;
      --green: #44cc66;
      --yellow: #ffcc33;
      --red: #ff4444;
      --blue: #4488ff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container { width: 100%; max-width: 680px; }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: #fff;
    }

    .subtitle {
      color: var(--text2);
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    /* ---- Tabs ---- */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      padding: 10px 20px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text2);
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
      user-select: none;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: #fff;
      border-bottom-color: var(--accent);
    }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text2);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"], select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, select:focus { border-color: var(--accent); }

    /* Title preview */
    #titlePreview {
      font-size: 0.85rem;
      color: var(--green);
      min-height: 1.2em;
      margin-top: 4px;
      word-break: break-all;
    }
    #titlePreview.loading { color: var(--text2); font-style: italic; }
    #titlePreview.error { color: var(--red); }

    /* Plex checkbox */
    .plex-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .plex-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .plex-row label {
      display: inline;
      font-size: 0.85rem;
      color: var(--text);
      text-transform: none;
      letter-spacing: 0;
      cursor: pointer;
      margin-bottom: 0;
    }
    .plex-hint {
      font-size: 0.75rem;
      color: var(--text2);
      margin-left: 24px;
      margin-top: -8px;
      margin-bottom: 16px;
    }

    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; margin-bottom: 0; }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.2s, transform 0.1s;
      margin-top: 20px;
      width: 100%;
    }

    .btn:hover { filter: brightness(1.15); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 8px 20px;
      font-size: 0.85rem;
      width: auto;
      margin-top: 12px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text2);
      margin-bottom: 20px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text2);
    }
    .dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot.error  { background: var(--red); }

    .task-list { display: flex; flex-direction: column; gap: 10px; }

    .task {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .task-title {
      font-size: 0.9rem;
      font-weight: 500;
      color: #fff;
      word-break: break-word;
      flex: 1;
      padding-right: 12px;
    }

    .task-badge {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge-pending { background: #333; color: #888; }
    .badge-downloading { background: #1a3a1a; color: var(--green); border: 1px solid var(--green); }
    .badge-processing { background: #3a2a00; color: var(--yellow); border: 1px solid var(--yellow); }
    .badge-completed { background: #1a2a1a; color: var(--green); }
    .badge-error { background: #2a1a1a; color: var(--red); }

    /* URL row */
    .task-url-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
    }
    .task-url-label {
      font-size: 0.7rem;
      color: var(--text2);
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .task-url {
      font-size: 0.75rem;
      color: var(--text2);
      text-decoration: none;
      word-break: break-all;
      flex: 1;
      cursor: pointer;
      border-bottom: 1px dashed var(--border);
      transition: color 0.2s;
    }
    .task-url:hover { color: var(--accent); }

    /* Filename */
    .task-filename {
      font-size: 0.75rem;
      color: var(--green);
      margin-bottom: 10px;
      word-break: break-all;
    }

    .progress-wrap {
      background: var(--surface2);
      border-radius: 6px;
      height: 6px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 6px;
      transition: width 0.4s ease;
      width: 0%;
    }

    .task-message {
      font-size: 0.8rem;
      color: var(--text2);
      display: flex;
      justify-content: space-between;
    }

    .task-error { color: var(--red); }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text2);
      font-size: 0.9rem;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- History tab ---- */
    .log-list { display: flex; flex-direction: column; gap: 8px; }

    .log-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      animation: fadeIn 0.3s ease;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .log-title {
      font-size: 0.88rem;
      font-weight: 500;
      color: #fff;
      word-break: break-word;
      flex: 1;
      padding-right: 10px;
    }

    .log-badge {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .log-badge.video { background: #1a2a3a; color: var(--blue); }
    .log-badge.audio { background: #2a1a3a; color: #aa66cc; }

    .log-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      font-size: 0.75rem;
      color: var(--text2);
      margin-bottom: 4px;
    }
    .log-meta span { white-space: nowrap; }
    .log-path {
      font-size: 0.72rem;
      color: var(--green);
      word-break: break-all;
      margin-top: 4px;
    }
    .log-url {
      font-size: 0.72rem;
      color: var(--text2);
      text-decoration: none;
      border-bottom: 1px dashed var(--border);
    }
    .log-url:hover { color: var(--accent); }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      font-size: 0.85rem;
      color: var(--text2);
    }
    .pagination button {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: border-color 0.2s;
    }
    .pagination button:hover:not(:disabled) { border-color: var(--accent); }
    .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
    .pagination .page-info { color: var(--text2); font-size: 0.8rem; }

    .log-empty {
      text-align: center;
      padding: 30px 20px;
      color: var(--text2);
      font-size: 0.9rem;
    }

    /* ---- Server Log tab ---- */
    .server-log {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.75rem;
      line-height: 1.6;
      max-height: 70vh;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .server-log .log-line { margin: 0; }
    .server-log .log-warn { color: var(--yellow); }
    .server-log .log-error { color: var(--red); }
    .server-log .log-info { color: var(--text2); }
    .server-log-empty {
      text-align: center;
      padding: 30px 20px;
      color: var(--text2);
      font-size: 0.9rem;
    }
    .log-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .log-toolbar span {
      font-size: 0.78rem;
      color: var(--text2);
    }
    .log-refresh-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .log-refresh-btn:hover { border-color: var(--accent); }

    /* ---- Metadata editor modal ---- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 32px;
      width: 90%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }
    .modal-filepath {
      font-size: 0.72rem;
      color: var(--green);
      word-break: break-all;
      margin-bottom: 20px;
    }
    .modal-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      align-items: flex-end;
    }
    .modal-row .form-group { flex: 1; margin-bottom: 0; }
    .modal-field {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
    }
    .modal-field:focus { border-color: var(--accent); }
    .modal-label {
      font-size: 0.72rem;
      color: var(--text2);
      margin-bottom: 4px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }
    .btn-autofill {
      background: #2a3a5a;
      border: 1px solid var(--blue);
      color: var(--blue);
      border-radius: 7px;
      padding: 9px 18px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: filter 0.2s;
    }
    .btn-autofill:hover { filter: brightness(1.2); }
    .btn-save {
      background: var(--green);
      color: #000;
      border: none;
      border-radius: 7px;
      padding: 9px 22px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.2s;
    }
    .btn-save:hover { filter: brightness(1.15); }
    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
      border-radius: 7px;
      padding: 9px 18px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .btn-cancel:hover { border-color: var(--text); }
    .btn-edit {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      flex-shrink: 0;
    }
    .btn-edit:hover { border-color: var(--accent); color: var(--accent); }
    .autofill-spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .autofill-note { font-size: 0.72rem; color: var(--text2); margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>YouTube Downloader</h1>
    <p class="subtitle">Real-time · WebSocket · Video + Audio</p>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" data-tab="tasks" onclick="switchTab('tasks')">Tasks</div>
      <div class="tab" data-tab="logs" onclick="switchTab('logs')">History</div>
      <div class="tab" data-tab="serverlog" onclick="switchTab('serverlog')">Server Log</div>
    </div>

    <!-- Task tab -->
    <div class="tab-pane active" id="pane-tasks">
      <div class="status-bar">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">Connecting......</span>
      </div>

      <div class="card">
        <form id="downloadForm">
          <div class="form-group">
            <label>YouTube URL</label>
            <input type="text" id="urlInput"
              placeholder="https://www.youtube.com/watch?v=..."
              value="" />
            <div id="titlePreview"></div>
          </div>

          <div class="form-group">
            <label>Custom Filename <span style="font-weight:400;text-transform:none;font-size:0.75em;color:var(--text2)">(optional, leave blank to use video title)</span></label>
            <input type="text" id="customNameInput"
              placeholder="my_video"
              value="" />
          </div>

          <div class="plex-row">
            <input type="checkbox" id="plexCheck" checked />
            <label for="plexCheck">Plex Server Compatible</label>
          </div>
          <div class="plex-hint">Prioritize H.264/AAC encoding, output MP4 format for Plex compatibility</div>

          <div class="row">
            <div class="form-group">
              <label>Format</label>
              <select id="formatSelect">
                <option value="video">Video (MP4)</option>
                <option value="audio">Audio Only (MP3)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Quality</label>
              <select id="qualitySelect">
                <option value="1080p">1080p</option>
                <option value="720p">720p</option>
                <option value="480p">480p</option>
                <option value="360p">360p</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn" id="submitBtn">Download</button>
        </form>
      </div>

      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <span style="font-size:0.85rem; color:var(--text2);">TasksHistory</span>
          <button class="btn btn-clear" id="clearBtn">Clear Completed</button>
        </div>
        <div id="taskList"></div>
      </div>
    </div>

    <!-- History tab -->
    <div class="tab-pane" id="pane-logs">
      <div class="card" id="logCard">
        <div id="logList"></div>
        <div class="pagination" id="logPagination"></div>
      </div>
    </div>

    <!-- Server Log tab -->
    <div class="tab-pane" id="pane-serverlog">
      <div class="card">
        <div class="log-toolbar">
          <span>logs/app.log</span>
          <button class="log-refresh-btn" onclick="loadServerLog()">Refresh</button>
        </div>
        <div id="serverLogOutput"></div>
      </div>
    </div>
  </div>

  <!-- Metadata Editor Modal -->
  <div class="modal-overlay" id="metaModal">
    <div class="modal-box">
      <div class="modal-title">Edit Metadata</div>
      <div class="modal-filepath" id="metaFilepath"></div>

      <div class="autofill-note">Click "Auto-fill" to query MusicBrainz, then edit any field and save.</div>

      <div class="modal-row">
        <div class="form-group">
          <label class="modal-label">Artist</label>
          <input type="text" class="modal-field" id="metaArtist" placeholder="Artist name" />
        </div>
        <div class="form-group">
          <label class="modal-label">Title</label>
          <input type="text" class="modal-field" id="metaTitle" placeholder="Track title" />
        </div>
      </div>
      <div class="modal-row">
        <div class="form-group">
          <label class="modal-label">Album</label>
          <input type="text" class="modal-field" id="metaAlbum" placeholder="Album name" />
        </div>
        <div class="form-group" style="flex:0 0 80px;">
          <label class="modal-label">Year</label>
          <input type="text" class="modal-field" id="metaYear" placeholder="2024" />
        </div>
      </div>
      <div class="modal-row">
        <div class="form-group">
          <label class="modal-label">Genre</label>
          <input type="text" class="modal-field" id="metaGenre" placeholder="Pop / Rock / etc." />
        </div>
        <div class="form-group">
          <label class="modal-label">Cover URL</label>
          <input type="text" class="modal-field" id="metaCover" placeholder="https://..." />
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-autofill" id="autofillBtn" onclick="doAutoFill()">Auto-fill</button>
        <button class="btn-cancel" onclick="closeMetaModal()">Cancel</button>
        <button class="btn-save" id="metaSaveBtn" onclick="doSaveMeta()">Save</button>
      </div>
    </div>
  </div>

  <!-- Socket.IO client (bundled locally) -->
  <script src="/static/socket.io.min.js"></script>
  <script>
    // ---- WebSocket connection ----
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");

    const socket = io({
      transports: ["polling", "websocket"],
      reconnectionDelay: 1000,
      reconnectionAttempts: 10,
    });

    socket.on("connect", () => {
      statusDot.className = "dot active";
      statusText.textContent = "Online · Real-time";
      // Request current task list on connect
      socket.emit("request_tasks");
    });

    socket.on("disconnect", () => {
      statusDot.className = "dot error";
      statusText.textContent = "Disconnected · Reconnecting......";
    });

    socket.on("connect_error", () => {
      statusDot.className = "dot error";
      statusText.textContent = "Connection failed";
    });

    // ---- Task state ----
    let tasks = {};

    // ---- Tab switching ----
    let currentTab = "tasks";

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
      document.querySelector(`.tab[data-tab="${tab}"]`).classList.add("active");
      document.getElementById(`pane-${tab}`).classList.add("active");
      if (tab === "logs") loadHistory(1);
      if (tab === "serverlog") loadServerLog();
    }

    let titleFetchTimer = null;
    let logPage = 1;

    // ---- Title preview on URL input ----
    async function fetchTitle(url) {
      if (!url || !url.includes("youtube.com") && !url.includes("youtu.be")) {
        document.getElementById("titlePreview").textContent = "";
        return;
      }
      const el = document.getElementById("titlePreview");
      el.innerHTML = '<span class="spinner"></span>Fetching title......';
      el.className = "loading";
      try {
        const resp = await fetch("/title?url=" + encodeURIComponent(url));
        const data = await resp.json();
        if (data.title) {
          el.textContent = data.title;
          el.className = "";
        } else {
          el.textContent = "Cannot Fetching title...";
          el.className = "error";
        }
      } catch (e) {
        el.textContent = "Failed to fetch title";
        el.className = "error";
      }
    }

    document.getElementById("urlInput").addEventListener("input", (e) => {
      clearTimeout(titleFetchTimer);
      const url = e.target.value.trim();
      if (!url) {
        document.getElementById("titlePreview").textContent = "";
        return;
      }
      titleFetchTimer = setTimeout(() => fetchTitle(url), 600);
    });

    // ---- Task rendering ----
    function renderTasks() {
      const list = document.getElementById("taskList");
      const arr = Object.values(tasks);
      if (arr.length === 0) {
        list.innerHTML = '<div class="empty">No Tasks</div>';
        return;
      }
      arr.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      list.innerHTML = arr.map(t => {
        const badge = {
          pending: "Pending",
          downloading: "Downloading",
          processing: "Processing",
          completed: "Completed",
          error: "Error",
        }[t.status] || t.status;

        const cls = {
          pending: "badge-pending",
          downloading: "badge-downloading",
          processing: "badge-processing",
          completed: "badge-completed",
          error: "badge-error",
        }[t.status] || "badge-pending";

        const msg = t.error
          ? `<span class="task-error">${t.error}</span>`
          : `<span>${t.message || ""}</span><span>${t.progress !== undefined ? t.progress + "%" : ""}</span>`;

        const filenameHtml = t.filename
          ? `<div class="task-filename">&#128193; ${t.filename}</div>`
          : "";

        const urlLabel = t.title
          ? `<span class="task-url-label">URL</span>
             <a class="task-url" href="${t.url}" target="_blank" rel="noopener">${t.url}</a>`
          : `<span class="task-url-label">URL</span>
             <a class="task-url" href="${t.url}" target="_blank" rel="noopener">${t.url}</a>`;

        return `
          <div class="task">
            <div class="task-header">
              <div class="task-title">${t.title || t.url || "Unknown"}</div>
              ${(t.format === 'audio' && t.filename && t.status === 'completed')
                ? `<button class="btn-edit" onclick="openMetaModal('${t.filename.replace(/'/g, "\\'")}')">Edit Metadata</button>`
                : ''}
              <span class="task-badge ${cls}">${badge}</span>
            </div>
            <div class="task-url-row">${urlLabel}</div>
            ${filenameHtml}
            <div class="progress-wrap">
              <div class="progress-bar" style="width:${t.progress || 0}%"></div>
            </div>
            <div class="task-message">${msg}</div>
          </div>
        `;
      }).join("");
    }

    // ---- WebSocket event handlers ----
    socket.on("task_list", (serverTasks) => {
      tasks = {};
      for (const t of serverTasks) {
        tasks[t.id] = t;
      }
      renderTasks();
    });

    socket.on("task_update", (task) => {
      tasks[task.id] = task;
      renderTasks();
    });

    socket.on("tasks_cleared", () => {
      // Refresh full list from server
      socket.emit("request_tasks");
    });

    // ---- Download form ----
    document.getElementById("downloadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const url = document.getElementById("urlInput").value.trim();
      const format = document.getElementById("formatSelect").value;
      const quality = document.getElementById("qualitySelect").value;
      const plex = document.getElementById("plexCheck").checked;
      const customName = document.getElementById("customNameInput").value.trim();
      if (!url) return;

      const titleEl = document.getElementById("titlePreview");
      const previewTitle = titleEl.textContent && !titleEl.className.includes("error")
        ? titleEl.textContent : null;

      document.getElementById("submitBtn").disabled = true;
      document.getElementById("submitBtn").textContent = "Submitting......";

      try {
        const res = await fetch("/download", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url, format, quality, plex_compatible: plex, custom_name: customName }),
        });
        const data = await res.json();
        if (!res.ok) {
          alert("Error: " + (data.error || "UnknownError"));
        } else if (data.task && previewTitle) {
          data.task.title = previewTitle;
          tasks[data.task.id] = data.task;
          renderTasks();
        }
      } catch (err) {
        alert("Request failed: " + err.message);
      } finally {
        document.getElementById("submitBtn").disabled = false;
        document.getElementById("submitBtn").textContent = "Download";
      }
    });

    // ---- Clear completed ----
    document.getElementById("clearBtn").addEventListener("click", async () => {
      await fetch("/clear", { method: "POST" });
    });

    // ---- History tab ----
    async function loadHistory(page) {
      logPage = page;
      const logList = document.getElementById("logList");
      const pagination = document.getElementById("logPagination");
      logList.innerHTML = '<div class="log-empty"><span class="spinner"></span>Loading......</div>';

      try {
        const res = await fetch(`/logs?page=${page}`);
        const data = await res.json();

        if (!data.items || data.items.length === 0) {
          logList.innerHTML = '<div class="log-empty">No download records</div>';
          pagination.innerHTML = '';
          return;
        }

        logList.innerHTML = data.items.map(item => {
          const badgeClass = item.format === 'audio' ? 'audio' : 'video';
          const badgeText = item.format === 'audio' ? 'MP3' : 'MP4';
          const sizeStr = item.size_mb ? `${item.size_mb} MB` : '';
          const statusIcon = item.status === 'success'
            ? '<span style="color:var(--green)">&#10004;</span>'
            : '<span style="color:var(--red)">&#10008;</span>';
          return `
            <div class="log-item">
              <div class="log-header">
                <div class="log-title">${item.title || item.url || 'Unknown title'}</div>
                <span class="log-badge ${badgeClass}">${badgeText} · ${item.quality || ''}</span>
              </div>
              <div class="log-meta">
                <span>${statusIcon} ${item.status || ''}</span>
                <span>&#128196; ${item.ts ? item.ts.replace('T', ' ') : ''}</span>
                ${sizeStr ? `<span>&#128190; ${sizeStr}</span>` : ''}
              </div>
              <div class="log-url">${item.url}</div>
              ${item.filename ? `<div class="log-path">${item.filename}</div>` : ''}
              ${item.error ? `<div style="font-size:0.75rem;color:var(--red);margin-top:4px;">Error: ${item.error}</div>` : ''}
            </div>
          `;
        }).join('');

        // Pagination controls
        if (data.pages > 1) {
          pagination.innerHTML = `
            <button onclick="loadHistory(${data.page - 1})" ${data.page <= 1 ? 'disabled' : ''}>Prev</button>
            <span class="page-info">Page ${data.page} / ${data.pages} (Total: ${data.total})</span>
            <button onclick="loadHistory(${data.page + 1})" ${data.page >= data.pages ? 'disabled' : ''}>Next</button>
          `;
        } else {
          pagination.innerHTML = `<span class="page-info">Total: ${data.total} records</span>`;
        }
      } catch (e) {
        logList.innerHTML = '<div class="log-empty">Failed to load: ' + e.message + '</div>';
        pagination.innerHTML = '';
      }
    }

    // ---- Server Log tab ----
    async function loadServerLog() {
      const output = document.getElementById("serverLogOutput");
      output.innerHTML = '<div class="server-log-empty"><span class="spinner"></span>Loading......</div>';
      try {
        const res = await fetch("/api/app-log?lines=200");
        const data = await res.json();
        if (!data.lines || data.lines.length === 0) {
          output.innerHTML = '<div class="server-log-empty">No server log entries yet</div>';
          return;
        }
        output.innerHTML = '<pre class="server-log">' + data.lines.map(line => {
          const cls = line.includes(' [ERROR]') ? 'log-error'
                     : line.includes(' [WARNING]') ? 'log-warn'
                     : 'log-info';
          return `<div class="log-line ${cls}">${escapeHtml(line)}</div>`;
        }).join('') + '</pre>';
      } catch (e) {
        output.innerHTML = '<div class="server-log-empty">Failed to load: ' + e.message + '</div>';
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ---- Metadata Editor Modal ----
    let _metaCurrentFilepath = null;

    function openMetaModal(filepath) {
      _metaCurrentFilepath = filepath;
      document.getElementById('metaFilepath').textContent = filepath;
      document.getElementById('metaArtist').value = '';
      document.getElementById('metaTitle').value = '';
      document.getElementById('metaAlbum').value = '';
      document.getElementById('metaYear').value = '';
      document.getElementById('metaGenre').value = '';
      document.getElementById('metaCover').value = '';
      document.getElementById('autofillBtn').innerHTML = 'Auto-fill';
      document.getElementById('autofillBtn').disabled = false;
      document.getElementById('metaModal').classList.add('open');
    }

    function closeMetaModal() {
      document.getElementById('metaModal').classList.remove('open');
      _metaCurrentFilepath = null;
    }

    async function doAutoFill() {
      if (!_metaCurrentFilepath) return;
      const btn = document.getElementById('autofillBtn');
      btn.innerHTML = '<span class="autofill-spinner"></span>Searching...';
      btn.disabled = true;
      try {
        const resp = await fetch('/api/metadata-form?filepath=' + encodeURIComponent(_metaCurrentFilepath));
        const data = await resp.json();
        if (data.error) {
          alert('Error: ' + data.error);
        } else {
          const s = data.suggestion;
          if (s.artist) document.getElementById('metaArtist').value = s.artist;
          if (s.title) document.getElementById('metaTitle').value = s.title;
          if (s.album) document.getElementById('metaAlbum').value = s.album;
          if (s.year) document.getElementById('metaYear').value = s.year;
          if (s.genre) document.getElementById('metaGenre').value = s.genre;
          if (s.cover_url) document.getElementById('metaCover').value = s.cover_url;
        }
      } catch (e) {
        alert('Auto-fill failed: ' + e.message);
      } finally {
        btn.innerHTML = 'Auto-fill';
        btn.disabled = false;
      }
    }

    async function doSaveMeta() {
      if (!_metaCurrentFilepath) return;
      const saveBtn = document.getElementById('metaSaveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';
      try {
        const resp = await fetch('/api/save-metadata', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            filepath: _metaCurrentFilepath,
            artist: document.getElementById('metaArtist').value,
            title: document.getElementById('metaTitle').value,
            album: document.getElementById('metaAlbum').value,
            year: document.getElementById('metaYear').value,
            genre: document.getElementById('metaGenre').value,
            cover_url: document.getElementById('metaCover').value,
          }),
        });
        const data = await resp.json();
        if (data.ok) {
          closeMetaModal();
        } else {
          alert('Save failed: ' + (data.error || 'Unknown error'));
        }
      } catch (e) {
        alert('Save failed: ' + e.message);
      } finally {
        saveBtn.textContent = 'Save';
        saveBtn.disabled = false;
      }
    }

    // Close modal on overlay click
    document.getElementById('metaModal').addEventListener('click', function(e) {
      if (e.target === this) closeMetaModal();
    });
  </script>
</body>
</html>
